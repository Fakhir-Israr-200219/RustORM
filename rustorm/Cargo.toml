[package]
name = "rustorm"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "bigdecimal",
    "rust_decimal",
    "chrono",
    "json",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = "0.4"
rust_decimal = "1"
serde_json = "1"